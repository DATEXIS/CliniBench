[project]
name = "clinibench"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.11.*"
dependencies = [
    "pandas>=2.3.3",
    "txtai>=9.3.0",
    "tqdm>=4.67.1",
    "openpyxl>=3.1.5",
    "pyarrow>=23.0.0",
    "torch>=2.9.0",
    "transformers>=4.57.6",
    "accelerate>=1.12.0",
    "aiohttp>=3.13.3",
    "httpx>=0.28.1",
    "openai>=2.15.0",
    "torchmetrics>=1.8.2",
    "scikit-learn>=1.7.2",
    "lightning[pytorch-extra]>=2.3.3",
    "jsonargparse[signatures]~=4.30.0",
    "wandb[workspaces]~=0.18.1",
    "numpy>=2.4.1",
    "polars[connectorx]>=1.30.0",
    "psycopg2-binary>=2.9.10",
    "scikit-multilearn-ng>=0.0.8",
    "typer>=0.16.0",
    "fastbm25>=0.0.2",
    "sentence_transformers>=5.2.0",
    "black>=26.1.0",
]

[tool.uv]
index-strategy = "unsafe-first-match"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
